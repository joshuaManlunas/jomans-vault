name: CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: jomans-vault
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      NODE_ENV: test
      BETTER_AUTH_SECRET: factory-checks-placeholder-secret-0000000000
      BETTER_AUTH_URL: http://localhost:3001
      DATABASE_URL: postgresql://postgres:password@localhost:5432/jomans-vault
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Run factory checks
        run: |
          python3 -m json.tool factory/config.json >/dev/null
          for f in factory/bin/dashboard factory/bin/doctor factory/bin/forge factory/bin/gate factory/bin/job factory/bin/models factory/bin/route; do
            python3 -c 'import ast, sys; ast.parse(open(sys.argv[1]).read(), sys.argv[1])' "$f"
          done
          bash -n factory/checks.sh
          bash -n factory/preflight.sh
          python3 -m unittest discover -s factory/tests -v
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint and format check
        run: bun run check
      - name: Typecheck
        run: bun run check-types
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test
